name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      prerelease:
        description: "Mark as pre-release?"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git unzip curl ca-certificates qrencode
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          apt-get install -y --no-install-recommends gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install 3DS portlibs
        run: dkp-pacman -Sy --noconfirm 3ds-dev || true

      - name: Build 3dsx
        run: make -j$(nproc)

      - name: Install CIA tools
        run: |
          curl -fsSL "https://github.com/Epicpkmn11/bannertool/releases/latest/download/bannertool.zip" -o /tmp/bt.zip
          unzip -q /tmp/bt.zip -d /tmp/bt
          install -m 755 /tmp/bt/linux-x86_64/bannertool /usr/local/bin/bannertool
          curl -fsSL "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip" -o /tmp/mr.zip
          unzip -q /tmp/mr.zip -d /tmp/mr
          install -m 755 /tmp/mr/makerom /usr/local/bin/makerom

      - name: Build CIA
        run: make cia

      - name: Collect release artifacts and QR code
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp 3dsToPdf.3dsx 3dsToPdf.cia dist/
          # FBI's Remote Install -> Scan QR Code downloads and installs the CIA
          # straight from this URL.
          qrencode -s 8 -m 2 -o dist/cia_qr.png \
            "https://github.com/${REPO}/releases/download/${RELEASE_TAG}/3dsToPdf.cia"
          ls -lh dist/

      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/notes.md <<NOTES
          ## 3DS PDF Reader ${RELEASE_TAG}

          ### Install over Wi-Fi
          In FBI choose **Remote Install → Scan QR Code** and scan:

          ![CIA QR code](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/cia_qr.png)

          ### Install from the SD card
          - **CIA:** copy \`3dsToPdf.cia\` to the SD card and install it with FBI.
          - **Homebrew Launcher:** copy \`3dsToPdf.3dsx\` to \`/3ds/3dsToPdf/\`.

          Put your PDF files in a \`pdf\` folder at the root of the SD card.

          Built from \`${COMMIT_SHA}\`.
          NOTES
          gh release create "$RELEASE_TAG" \
            --title "3DS PDF Reader $RELEASE_TAG" \
            $([ "$IS_PRERELEASE" = "true" ] && echo "--prerelease") \
            --notes-file /tmp/notes.md \
            dist/3dsToPdf.3dsx dist/3dsToPdf.cia dist/cia_qr.png
